<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - Muscle Recovery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell auth-shell">
      <section class="panel auth-card">
        <p class="eyebrow">Body Comp</p>
        <h1>Choose a profile</h1>
        <p class="auth-copy">BodyComp stores each local profile separately on this Windows account.</p>
        <p id="authStatus" class="form-status" role="status"></p>
        <div id="profileList" class="profile-list" aria-live="polite"></div>
        <form id="createProfileForm" class="auth-form">
          <label>New profile name<input id="newProfileName" maxlength="80" autocomplete="off" required /></label>
          <button id="createProfileButton" class="button" type="submit">Create profile</button>
        </form>
        <p class="field-hint">Profiles are separate local databases, not password-protected accounts. Use separate Windows logins for operating-system privacy.</p>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
