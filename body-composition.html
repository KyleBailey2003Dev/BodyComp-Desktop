<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Composition - Body Forge</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell composition-shell">
      <header class="titlebar">
        <div>
          <p class="eyebrow">Body Comp</p>
          <h1>Body Composition</h1>
        </div>
        <div class="view-toggle">
          <a href="front_view.html">Body Map</a>
          <a href="settings.html">Settings</a>
        </div>
      </header>

      <section class="composition-layout">
        <section class="panel composition-entry">
          <div>
            <p class="eyebrow">Measurement</p>
            <h2 id="measurementHeading">Add measurement</h2>
          </div>
          <form id="measurementForm" class="measurement-form">
            <label>
              Recorded date
              <input id="recordedDate" type="date" required />
            </label>
            <label>
              Weight
              <div class="measurement-weight-input">
                <input
                  id="weightInput"
                  type="number"
                  min="0.01"
                  step="0.01"
                  inputmode="decimal"
                  required
                />
                <select id="weightUnit" aria-label="Weight unit">
                  <option value="lb">lb</option>
                  <option value="kg">kg</option>
                </select>
              </div>
            </label>
            <label>
              Body fat
              <div class="measurement-percent-input">
                <input
                  id="bodyFatInput"
                  type="number"
                  min="0"
                  max="100"
                  step="0.1"
                  inputmode="decimal"
                  required
                />
                <span>%</span>
              </div>
            </label>
            <p
              id="leanMassPreview"
              class="lean-mass-preview"
              aria-live="polite"
            >
              Enter weight and body fat to calculate lean mass.
            </p>
            <div class="measurement-form-actions">
              <button id="measurementSubmit" class="button" type="submit">
                Save measurement
              </button>
              <button
                id="cancelMeasurementEdit"
                class="button button-secondary"
                type="button"
                hidden
              >
                Cancel edit
              </button>
            </div>
            <p
              id="measurementStatus"
              class="form-status"
              aria-live="polite"
            ></p>
          </form>
        </section>

        <section class="panel composition-history">
          <div class="measurement-history-header">
            <div>
              <p class="eyebrow">Personal records</p>
              <h2>Measurement history</h2>
            </div>
            <label class="history-unit-control">
              Display units
              <select id="historyWeightUnit" aria-label="Display weight units">
                <option value="lb">lb</option>
                <option value="kg">kg</option>
              </select>
            </label>
          </div>
          <div id="measurementList" class="measurement-list" aria-live="polite">
            <p class="empty-state">Loading measurements...</p>
          </div>
        </section>
      </section>
    </main>

    <script src="nav-config.js"></script>
    <script src="nav-utils.js"></script>
    <script src="api.js"></script>
    <script src="profile-menu.js"></script>
    <script src="ui-utils.js"></script>
    <script src="body-composition.js"></script>
  </body>
</html>
