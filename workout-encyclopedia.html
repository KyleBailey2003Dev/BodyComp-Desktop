<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Encyclopedia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="titlebar">
            <div>
                <p class="eyebrow">Body Comp</p>

            <div class="panel encyclopedia-panel">

                    </div>
                </div>

                <div class ="button-group">

                    <a href="workout-encyclopedia.html#chestGroupSection" class="muscle-group-button" data-muscle-group="chest">Chest</a>

                </div>

                <div
                    id="workoutEncyclopedia"
                    class="workout-exercises"
                    aria-live="polite"
                ></div>
            </div>
        </section>
